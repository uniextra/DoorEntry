services:
  doorentry-web:
    build: .
    image: uniextra/doorentry:latest
    container_name: doorentry-web
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9078:9078/udp"
      - "7076:7076/udp"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - LOCAL_IP=${LOCAL_IP:-}
